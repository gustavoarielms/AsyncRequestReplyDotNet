name: Example Tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  example-tests:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore AsyncRequestReply.sln

      - name: Build solution
        run: dotnet build AsyncRequestReply.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test AsyncRequestReply.sln --configuration Release --no-build

      - name: Pack library
        run: dotnet pack src/AsyncRequestReply/AsyncRequestReply.csproj --configuration Release --no-build --output ./artifacts
