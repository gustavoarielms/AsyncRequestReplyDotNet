name: Example Tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  example-tests:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    services:
      redis:
        image: redis:7.4.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore AsyncRequestReply.sln

      - name: Build solution
        run: dotnet build AsyncRequestReply.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test AsyncRequestReply.sln --configuration Release --no-build
        env:
          ASYNC_REQUEST_REPLY_REDIS_CONNECTION: localhost:6379

      - name: Pack library
        run: dotnet pack src/AsyncRequestReply/AsyncRequestReply.csproj --configuration Release --no-build --output ./artifacts

      - name: Restore NuGet sample from packed artifact
        run: >-
          dotnet restore
          samples/AsyncRequestReply.NuGetSampleApi/AsyncRequestReply.NuGetSampleApi.csproj
          --configfile samples/AsyncRequestReply.NuGetSampleApi/NuGet.config

      - name: Build NuGet sample
        run: >-
          dotnet build
          samples/AsyncRequestReply.NuGetSampleApi/AsyncRequestReply.NuGetSampleApi.csproj
          --configuration Release
          --no-restore
